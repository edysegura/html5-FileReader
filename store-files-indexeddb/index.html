<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Store and retrieve files using IndexedDB with Dexie.js"
    />
    <title>File Store - IndexedDB Manager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>File Store Manager</h1>
        <p>Store and retrieve files using IndexedDB</p>
      </header>

      <article>
        <section>
          <h2>Upload File</h2>
          <form id="uploadForm">
            <fieldset>
              <label for="fileInput">
                Select Image File
                <input
                  type="file"
                  id="fileInput"
                  accept="image/*"
                  aria-label="Select an image file to store"
                />
              </label>
              <small>Supported formats: JPEG, PNG, WebP, GIF</small>
            </fieldset>
          </form>
        </section>

        <section>
          <h2>Retrieve File</h2>
          <form id="retrieveForm">
            <fieldset>
              <div class="grid">
                <label for="recordId">
                  Record ID
                  <input
                    type="number"
                    id="recordId"
                    min="1"
                    placeholder="Enter file ID"
                    aria-label="Enter the ID of the file to retrieve"
                  />
                </label>
                <div class="flex-end">
                  <button type="button" id="loadBtn" class="outline">
                    Load File
                  </button>
                </div>
              </div>
            </fieldset>
          </form>

          <div id="filePreview">
            <img id="previewImage" alt="Preview of retrieved file" />
            <p id="previewInfo">
              <span id="uploadTime"></span>
            </p>
          </div>
        </section>

        <section>
          <h2>Stored Files</h2>
          <div
            id="filesList"
            aria-live="polite"
            aria-label="List of stored files"
          >
            <p id="noFiles">No files stored yet</p>
            <table id="filesTable">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Upload Date</th>
                  <th scope="col">Size (Bytes)</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody id="filesTableBody"></tbody>
            </table>
          </div>
        </section>
      </article>

      <footer>
        <small>
          Built with
          <a href="https://dexie.org/" target="_blank" rel="noopener"
            >Dexie.js</a
          >
          and
          <a href="https://picocss.com/" target="_blank" rel="noopener"
            >PicoCSS</a
          >
        </small>
      </footer>
    </main>
  </body>
</html>
